[workspace]
resolver = "3"
members = [
    "crates/*",
    "spikes/acp-stub-agent",
    "spikes/acp-host-claude",
    "spikes/mcp-stub",
    "spikes/pty-reattach",
]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# Internal crates
console-config = { path = "crates/config" }
console-proto = { path = "crates/proto" }
console-store = { path = "crates/store" }
console-queue = { path = "crates/queue" }
console-client = { path = "crates/client" }
console-orchestrator = { path = "crates/orchestrator" }
console-executor = { path = "crates/executor" }
console-cc-host = { path = "crates/cc-host" }
console-agent = { path = "crates/agent" }
console-acp-host = { path = "crates/acp-host" }
console-acp-bridge = { path = "crates/acp-bridge" }

# Protocols reused from M0
agent-client-protocol = "5.5"
rmcp = "3.11"

# Core
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ulid = { version = "3", features = ["serde"] }

# Services
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio-tungstenite = "0.30"
tokio-util = "0.7"

# Executor
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
nix = { version = "0.32", features = ["signal", "process"] }
http = "1"

# Dev
insta = { version = "1.49", features = ["json"] }
proptest = "1.12"
tempfile = "3"
