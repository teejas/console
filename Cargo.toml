[workspace]
resolver = "3"
members = [
    "crates/*",
    "spikes/acp-stub-agent",
    "spikes/acp-host-claude",
    "spikes/mcp-stub",
    "spikes/pty-reattach",
]
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
# Internal crates
console-config = { path = "crates/config" }

# Protocols reused from M0
agent-client-protocol = "5.5"
rmcp = "3.11"

# Core
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ulid = { version = "3", features = ["serde"] }

# Dev
insta = { version = "1.49", features = ["json"] }
