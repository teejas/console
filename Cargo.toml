[workspace]
resolver = "3"
members = [
    "spikes/acp-stub-agent",
    "spikes/acp-host-claude",
    "spikes/mcp-stub",
    "spikes/pty-reattach",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
agent-client-protocol = "5.5"
rmcp = "3.11"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
